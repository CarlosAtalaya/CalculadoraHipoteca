<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Hipotecas Avanzado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Comparador de Hipotecas</h1>
        
        <form id="formulario-hipotecas">
            <div class="general-info-panel">
                <h2>Información General</h2>
                
                <div class="form-group" style="margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                    <label for="num_simulaciones" style="font-size: 1.1rem;">¿Cuántas ofertas quieres comparar?</label>
                    <select id="num_simulaciones" name="num_simulaciones" style="width: auto; padding: 8px 15px;">
                        <option value="1">1 (Solo simulación)</option>
                        <option value="2" selected>2 ofertas</option>
                        <option value="3">3 ofertas</option>
                        <option value="4">4 ofertas</option>
                    </select>
                </div>

                <div class="general-info-container">
                    <div class="form-group">
                        <label for="valor_inmueble">Valor del inmueble (€):</label>
                        <input type="number" id="valor_inmueble" name="valor_inmueble" min="1" step="any" required placeholder="Ej: 200000">
                    </div>
                    <div class="form-group">
                        <label for="ahorros">Ahorros disponibles (€):</label>
                        <input type="number" id="ahorros" name="ahorros" min="0" step="any" required placeholder="Ej: 60000">
                    </div>
                </div>
                
                <h3>Gastos Fijos</h3>
                <div class="gastos-fijos-container">
                    <div class="form-group">
                        <label for="itp">ITP (%):</label>
                        <input type="number" id="itp" name="itp" value="3" min="0" max="15" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="notaria">Notaría (€):</label>
                        <input type="number" id="notaria" name="notaria" value="1100" step="any" required>
                    </div>
                    <div class="form-group">
                        <label for="registro">Registro (€):</label>
                        <input type="number" id="registro" name="registro" value="850" step="any" required>
                    </div>
                    <div class="form-group">
                        <label for="gestoria">Gestoría (€):</label>
                        <input type="number" id="gestoria" name="gestoria" value="350" step="any" required>
                    </div>
                    <div class="form-group">
                        <label for="tasacion">Tasación (€):</label>
                        <input type="number" id="tasacion" name="tasacion" value="300" step="any" required>
                    </div>
                </div>
            </div>
            
            <div class="simulaciones-container">
                
                <div class="simulacion-panel" id="panel-sim1">
                    <h2>Simulación 1</h2>
                    <div class="form-group">
                        <label for="entidad1">Entidad bancaria:</label>
                        <input type="text" id="entidad1" name="entidad1" placeholder="Ej: Banco A" required>
                    </div>
                    <div class="form-group">
                        <label for="entrada_porcentaje1">Entrada (%):</label>
                        <input type="number" id="entrada_porcentaje1" name="entrada_porcentaje1" value="20" min="0" max="100" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="valor1">A Financiar (€):</label>
                        <input type="number" id="valor1" name="valor1" readonly>
                    </div>
                    <div class="form-group">
                        <label for="anios1">Años:</label>
                        <input type="number" id="anios1" name="anios1" value="30" min="1" max="50" required>
                    </div>

                    <div class="form-group">
                        <label for="tin_partida1">TIN de Partida (Oferta sin bonificar %):</label>
                        <input type="number" id="tin_partida1" name="tin_partida1" min="0" step="0.01" placeholder="Ej: 3.50">
                    </div>

                    <button type="button" class="advanced-calc-btn" onclick="toggleProductos('1')">
                        <span><i class="fas fa-calculator"></i> Productos / Bonificaciones</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>

                    <div id="productos-container1" class="productos-container hidden">
                        <p style="font-size:0.9rem; color:#666; margin-bottom:10px;">Marca y ajusta la bonificación:</p>
                        
                        <div class="producto-row">
                            <label class="producto-check-label">
                                <input type="checkbox" class="prod-check" data-sim="1" value="Nómina">
                                Nómina / Ingresos
                            </label>
                            <div class="producto-detalles">
                                <span class="bonif-label">Bonif: -</span>
                                <input type="number" class="bonif-input" data-sim="1" value="0.50" step="0.01">
                                <span class="bonif-label">%</span>
                            </div>
                        </div>
                        
                        <div class="producto-row">
                            <label class="producto-check-label">
                                <input type="checkbox" class="prod-check" data-sim="1" value="Seguro Vida">
                                Seguro Vida
                            </label>
                            <div class="producto-detalles">
                                <span class="bonif-label">Bonif: -</span>
                                <input type="number" class="bonif-input" data-sim="1" value="0.25" step="0.01">
                                <span class="bonif-label">% | </span>
                                <input type="number" class="coste-input" data-sim="1" placeholder="Coste €" value="200" title="Coste anual estimado">
                            </div>
                        </div>

                        <div class="producto-row">
                            <label class="producto-check-label">
                                <input type="checkbox" class="prod-check" data-sim="1" value="Seguro Hogar">
                                Seguro Hogar
                            </label>
                            <div class="producto-detalles">
                                <span class="bonif-label">Bonif: -</span>
                                <input type="number" class="bonif-input" data-sim="1" value="0.20" step="0.01">
                                <span class="bonif-label">% | </span>
                                <input type="number" class="coste-input" data-sim="1" placeholder="Coste €" value="150">
                            </div>
                        </div>

                        <div class="producto-row">
                            <label class="producto-check-label">
                                <input type="checkbox" class="prod-check" data-sim="1" value="Alarma">
                                Alarma
                            </label>
                            <div class="producto-detalles">
                                <span class="bonif-label">Bonif: -</span>
                                <input type="number" class="bonif-input" data-sim="1" value="0.20" step="0.01">
                                <span class="bonif-label">% | </span>
                                <input type="number" class="coste-input" data-sim="1" placeholder="Coste €" value="500">
                            </div>
                        </div>

                        <input type="hidden" name="productos_json1" id="productos_json1">
                    </div>

                    <div class="form-group tin-final-container">
                        <label for="interes1" style="color:var(--primary-color);">TIN Bonificado (Aplicado):</label>
                        <div style="display:flex; align-items:center;">
                            <input type="number" id="interes1" name="interes1" class="tin-final-input" readonly step="0.01">
                            <span style="font-weight:bold;">%</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="anio_amortizacion1">Año amortización (opcional):</label>
                        <input type="number" id="anio_amortizacion1" name="anio_amortizacion1" value="10">
                    </div>
                    
                    <div class="resultados" id="resultados1"></div>
                </div>

                <div class="simulacion-panel" id="panel-sim2">
                    <h2>Simulación 2</h2>
                    <div class="form-group">
                        <label for="entidad2">Entidad bancaria:</label>
                        <input type="text" id="entidad2" name="entidad2" placeholder="Ej: Banco B" required>
                    </div>
                    <div class="form-group">
                        <label for="entrada_porcentaje2">Entrada (%):</label>
                        <input type="number" id="entrada_porcentaje2" name="entrada_porcentaje2" value="20" min="0" max="100" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="valor2">A Financiar (€):</label>
                        <input type="number" id="valor2" name="valor2" readonly>
                    </div>
                    <div class="form-group">
                        <label for="anios2">Años:</label>
                        <input type="number" id="anios2" name="anios2" value="30" min="1" max="50" required>
                    </div>

                    <div class="form-group">
                        <label for="tin_partida2">TIN de Partida (Oferta %):</label>
                        <input type="number" id="tin_partida2" name="tin_partida2" min="0" step="0.01" placeholder="Ej: 3.50">
                    </div>
                    <button type="button" class="advanced-calc-btn" onclick="toggleProductos('2')">
                        <span><i class="fas fa-calculator"></i> Productos / Bonificaciones</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div id="productos-container2" class="productos-container hidden">
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="2" value="Nómina"> Nómina</label>
                            <div class="producto-detalles"><span class="bonif-label">Bonif: -</span><input type="number" class="bonif-input" data-sim="2" value="0.50" step="0.01"><span class="bonif-label">%</span></div>
                        </div>
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="2" value="Seguro Vida"> Seguro Vida</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="2" value="0.25" step="0.01"><span class="bonif-label">% |</span><input type="number" class="coste-input" data-sim="2" value="200"></div>
                        </div>
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="2" value="Seguro Hogar"> Seguro Hogar</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="2" value="0.20" step="0.01"><span class="bonif-label">% |</span><input type="number" class="coste-input" data-sim="2" value="150"></div>
                        </div>
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="2" value="Alarma"> Alarma</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="2" value="0.20" step="0.01"><span class="bonif-label">% |</span><input type="number" class="coste-input" data-sim="2" value="500"></div>
                        </div>
                        <input type="hidden" name="productos_json2" id="productos_json2">
                    </div>
                    <div class="form-group tin-final-container">
                        <label for="interes2" style="color:var(--primary-color);">TIN Bonificado:</label>
                        <div style="display:flex; align-items:center;">
                            <input type="number" id="interes2" name="interes2" class="tin-final-input" readonly step="0.01">
                            <span style="font-weight:bold;">%</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="anio_amortizacion2">Año amortización:</label>
                        <input type="number" id="anio_amortizacion2" name="anio_amortizacion2" value="10">
                    </div>
                    <div class="resultados" id="resultados2"></div>
                </div>

                <div class="simulacion-panel hidden" id="panel-sim3">
                    <h2>Simulación 3</h2>
                    <div class="form-group"><label>Entidad:</label><input type="text" id="entidad3" name="entidad3"></div>
                    <div class="form-group"><label>Entrada (%):</label><input type="number" id="entrada_porcentaje3" name="entrada_porcentaje3" value="20"></div>
                    <div class="form-group"><label>A Financiar:</label><input type="number" id="valor3" name="valor3" readonly></div>
                    <div class="form-group"><label>Años:</label><input type="number" id="anios3" name="anios3" value="30"></div>
                    
                    <div class="form-group"><label>TIN Partida (%):</label><input type="number" id="tin_partida3" name="tin_partida3"></div>
                    <button type="button" class="advanced-calc-btn" onclick="toggleProductos('3')"><span>Bonificaciones</span><i class="fas fa-chevron-down"></i></button>
                    <div id="productos-container3" class="productos-container hidden">
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="3" value="Nómina"> Nómina</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="3" value="0.50"><span class="bonif-label">%</span></div>
                        </div>
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="3" value="Vida"> Vida</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="3" value="0.25"><span class="bonif-label">% |</span><input type="number" class="coste-input" data-sim="3" value="200"></div>
                        </div>
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="3" value="Hogar"> Hogar</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="3" value="0.20"><span class="bonif-label">% |</span><input type="number" class="coste-input" data-sim="3" value="150"></div>
                        </div>
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="3" value="Alarma"> Alarma</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="3" value="0.20"><span class="bonif-label">% |</span><input type="number" class="coste-input" data-sim="3" value="500"></div>
                        </div>
                        <input type="hidden" name="productos_json3" id="productos_json3">
                    </div>
                    <div class="form-group tin-final-container"><label>TIN Bonificado:</label><input type="number" id="interes3" name="interes3" class="tin-final-input" readonly></div>
                    <div class="form-group"><label>Año amortización:</label><input type="number" id="anio_amortizacion3" name="anio_amortizacion3" value="10"></div>
                    <div class="resultados" id="resultados3"></div>
                </div>

                <div class="simulacion-panel hidden" id="panel-sim4">
                    <h2>Simulación 4</h2>
                    <div class="form-group"><label>Entidad:</label><input type="text" id="entidad4" name="entidad4"></div>
                    <div class="form-group"><label>Entrada (%):</label><input type="number" id="entrada_porcentaje4" name="entrada_porcentaje4" value="20"></div>
                    <div class="form-group"><label>A Financiar:</label><input type="number" id="valor4" name="valor4" readonly></div>
                    <div class="form-group"><label>Años:</label><input type="number" id="anios4" name="anios4" value="30"></div>
                    
                    <div class="form-group"><label>TIN Partida (%):</label><input type="number" id="tin_partida4" name="tin_partida4"></div>
                    <button type="button" class="advanced-calc-btn" onclick="toggleProductos('4')"><span>Bonificaciones</span><i class="fas fa-chevron-down"></i></button>
                    <div id="productos-container4" class="productos-container hidden">
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="4" value="Nómina"> Nómina</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="4" value="0.50"><span class="bonif-label">%</span></div>
                        </div>
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="4" value="Vida"> Vida</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="4" value="0.25"><span class="bonif-label">% |</span><input type="number" class="coste-input" data-sim="4" value="200"></div>
                        </div>
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="4" value="Hogar"> Hogar</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="4" value="0.20"><span class="bonif-label">% |</span><input type="number" class="coste-input" data-sim="4" value="150"></div>
                        </div>
                        <div class="producto-row">
                            <label class="producto-check-label"><input type="checkbox" class="prod-check" data-sim="4" value="Alarma"> Alarma</label>
                            <div class="producto-detalles"><span class="bonif-label">-</span><input type="number" class="bonif-input" data-sim="4" value="0.20"><span class="bonif-label">% |</span><input type="number" class="coste-input" data-sim="4" value="500"></div>
                        </div>
                        <input type="hidden" name="productos_json4" id="productos_json4">
                    </div>
                    <div class="form-group tin-final-container"><label>TIN Bonificado:</label><input type="number" id="interes4" name="interes4" class="tin-final-input" readonly></div>
                    <div class="form-group"><label>Año amortización:</label><input type="number" id="anio_amortizacion4" name="anio_amortizacion4" value="10"></div>
                    <div class="resultados" id="resultados4"></div>
                </div>
            </div>
            
            <div class="buttons-container">
                <button type="submit" id="btn-calcular">Calcular Comparación</button>
                <button type="button" id="btn-pdf" class="btn-secondary">Descargar Informe PDF</button>
                <button type="button" id="btn-limpiar">Limpiar</button>
            </div>
        </form>
        
        <div class="comparacion-container hidden" id="comparacion-resultados"></div>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
